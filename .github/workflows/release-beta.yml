name: Release beta

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Install the exact supported OpenClaw host
        run: npm install --global openclaw@2026.7.1-2
      - name: Prepare the exact Fitness source package
        run: node scripts/prepare-exact-fitness.mjs "$RUNNER_TEMP/stella-fitness"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm run verify:env -- release --json
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: .stella/verification/release.json
          if-no-files-found: error
          retention-days: 14
      - run: npm publish --provenance --access public --tag beta
