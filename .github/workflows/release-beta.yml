name: Release beta

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read
  id-token: write

env:
  STELLA_FITNESS_EXPECTED_REVISION: ac1b8eaf55cf0cba4f5035b82ff74ac5ddd8cf8e

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Install the exact supported OpenClaw host
        run: npm install --global openclaw@2026.6.34
      - name: Prepare the exact Fitness source package
        run: |
          git clone --no-checkout https://github.com/tower1229/Stella-Fitness.git "$RUNNER_TEMP/stella-fitness"
          git -C "$RUNNER_TEMP/stella-fitness" fetch --depth=1 origin "$STELLA_FITNESS_EXPECTED_REVISION"
          git -C "$RUNNER_TEMP/stella-fitness" checkout --detach FETCH_HEAD
          npm ci --prefix "$RUNNER_TEMP/stella-fitness"
          npm run build --prefix "$RUNNER_TEMP/stella-fitness"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm run verify:env -- release --json
        env:
          STELLA_FITNESS_PACKAGE_ROOT: ${{ runner.temp }}/stella-fitness
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: .stella/verification/release.json
          if-no-files-found: error
          retention-days: 14
      - run: npm publish --provenance --access public --tag beta
