name: Release stable

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  verify:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Install the exact supported OpenClaw host
        run: |
          npm install --global openclaw@2026.6.34
          openclaw --version | grep -F "2026.6.34 (5c38f99)"
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          test "$(node -p "require('./package-lock.json').version")" = "$(node -p "require('./package.json').version")"
      - run: npm run verify:env -- release --json
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: .stella/verification/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Pack the exact release artifact
        run: |
          mkdir release
          npm pack --json --pack-destination release > release/pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      version: ${{ steps.pack.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release
      - name: Verify immutable release artifact
        id: pack
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          TARBALL="./release/$(node -p "require('./release/pack.json')[0].filename")"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "integrity=$(node -p "require('./release/pack.json')[0].integrity")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attest release tarball
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish with npm trusted publishing
        env:
          EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_INTEGRITY=""
          for attempt in {1..12}; do
            if PUBLISHED_INTEGRITY=$(npm view "$PACKAGE@$VERSION" dist.integrity 2>registry-error.log); then
              break
            fi
            if ! grep -q "E404" registry-error.log; then
              cat registry-error.log >&2
              exit 1
            fi
            if test "$attempt" -lt 12; then
              sleep 5
            fi
          done
          if test -n "$PUBLISHED_INTEGRITY"; then
            test "$PUBLISHED_INTEGRITY" = "$EXPECTED_INTEGRITY"
          else
            npm publish "${{ steps.pack.outputs.tarball }}" --access public
          fi
      - name: Verify registry integrity and signatures
        env:
          EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_INTEGRITY=""
          for attempt in {1..12}; do
            PUBLISHED_INTEGRITY=$(npm view "$PACKAGE@$VERSION" dist.integrity 2>/dev/null || true)
            if test -n "$PUBLISHED_INTEGRITY"; then
              break
            fi
            sleep 5
          done
          test "$PUBLISHED_INTEGRITY" = "$EXPECTED_INTEGRITY"
          mkdir registry-verification
          cd registry-verification
          npm init --yes
          npm install --ignore-scripts --save-exact "$PACKAGE@$VERSION"
          npm audit signatures
      - name: Render complete release notes from the changelog
        run: |
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          awk -v heading="## [$RELEASE_VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          test -s release/notes.md
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          ASSET=$(basename "$TARBALL")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$RELEASE_TAG" --pattern "$ASSET" --dir existing-release
            test "$(sha512sum "$TARBALL" | cut -d ' ' -f1)" = "$(sha512sum "existing-release/$ASSET" | cut -d ' ' -f1)"
            gh release edit "$RELEASE_TAG" --notes-file release/notes.md
          else
            gh release create "$RELEASE_TAG" "$TARBALL#npm package" --verify-tag --notes-file release/notes.md --title "Stella Runtime $RELEASE_TAG"
          fi

  registry-exact-host-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Install the exact supported OpenClaw host
        run: |
          npm install --global openclaw@2026.6.34
          openclaw --version | grep -F "2026.6.34 (5c38f99)"
      - name: Smoke the published registry artifact on the exact Host
        env:
          STELLA_RUNTIME_INSTALL_SPEC: "@tower1229/stella-cognitive-runtime@${{ needs.publish.outputs.version }}"
          STELLA_RUNTIME_EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
          STELLA_RUNTIME_EXPECTED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
        run: node --test --test-concurrency=1 tests/pack-install/openclaw-discovery.test.mjs
